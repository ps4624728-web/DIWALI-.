<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>शुभ दीपावली 🪔</title>
<style>
:root{--gold:#ffd54a;--gold2:#ff9d1c;--tx:#fff4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;color:var(--tx);background:radial-gradient(ellipse at 50% 0%,#7a1020 0%,#3b0614 45%,#13030a 100%) fixed;overflow-x:hidden}
.mandala{position:fixed;left:50%;top:46%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;z-index:0;opacity:.18;pointer-events:none;animation:spin 90s linear infinite;background:repeating-conic-gradient(from 0deg,#ffd54a 0 4deg,transparent 4deg 12deg),radial-gradient(circle,transparent 20%,#ff9d1c55 21% 23%,transparent 24% 40%,#ffd54a44 41% 43%,transparent 44%);-webkit-mask:radial-gradient(circle,#000 0,#0000 60%);mask:radial-gradient(circle,#000 0,#0000 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.petal{position:fixed;top:-40px;z-index:2;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(40px) rotate(400deg)}}
.toran{position:relative;z-index:4;display:flex;justify-content:space-around;font-size:30px;padding:0 6px;margin-bottom:-6px;border-top:5px solid var(--gold);background:linear-gradient(#ff9d1c33,transparent)}
.toran span{display:inline-block;transform-origin:top center;animation:sw 2.4s ease-in-out infinite alternate}
.toran span:nth-child(2n){animation-delay:-1.2s}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
main{position:relative;z-index:3;max-width:520px;margin:0 auto;padding:18px 14px 80px;text-align:center}
.card{position:relative;background:linear-gradient(160deg,#ffffff1c,#ffffff08);border:2px solid transparent;background-clip:padding-box;border-radius:26px;padding:22px 14px;backdrop-filter:blur(8px);box-shadow:0 0 0 2px #ffd54a99,0 0 40px #ff9d1c66,inset 0 0 30px #ffd54a22;animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.top{font-size:17px;letter-spacing:3px;color:var(--gold);font-weight:700}
h1{margin:6px 0;font-size:clamp(26px,7vw,38px);color:var(--gold);text-shadow:0 0 18px #ff9d1c}
input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--gold);background:#00000066;color:var(--tx);font-size:18px;text-align:center;margin:8px 0}
input::placeholder{color:#fff4dc88}
button,.btn{cursor:pointer;border:0;border-radius:30px;padding:14px 24px;font-size:16px;font-weight:800;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#3b0614;text-decoration:none;display:inline-block;margin:6px;box-shadow:0 4px 18px #ff9d1c88;font-family:inherit}
.btn:active,button:active{transform:scale(.95)}
.wa{background:linear-gradient(90deg,#25d366,#128c7e);color:#fff;font-size:18px;padding:16px 30px;animation:pulse 1.6s infinite;box-shadow:0 4px 22px #25d366aa}
@keyframes pulse{50%{transform:scale(1.06)}}
.hide{display:none}
.sub{font-size:15.5px;line-height:1.7;opacity:.95}
.name{font-size:clamp(36px,12vw,64px);font-weight:900;margin:6px 0;line-height:1.15;background:linear-gradient(90deg,#fff3b0,var(--gold),var(--gold2),#fff3b0);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite;filter:drop-shadow(0 0 14px #ff9d1c);word-break:break-word}
@keyframes sh{to{background-position:200%}}
.diyas{font-size:34px;letter-spacing:6px}
.diyas span{display:inline-block;animation:fl 1.1s ease-in-out infinite alternate}
.diyas span:nth-child(2n){animation-delay:.4s}
@keyframes fl{to{transform:scale(1.25) translateY(-4px);filter:drop-shadow(0 0 12px #ffb300)}}
.stage{position:relative;height:200px;margin:8px 0;background:radial-gradient(ellipse at 50% 90%,#ffd54a55,transparent 65%)}
.monkey{position:absolute;left:50%;bottom:0;font-size:100px;transform:translateX(-50%);animation:jump 1.5s ease-in-out infinite;cursor:pointer;user-select:none;filter:drop-shadow(0 8px 12px #0008)}
@keyframes jump{50%{transform:translateX(-50%) translateY(-20px) rotate(-5deg)}}
.plate{position:absolute;left:50%;bottom:58px;margin-left:44px;font-size:46px;animation:pl 1.5s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffd54a)}
@keyframes pl{50%{transform:translateY(-18px) rotate(10deg)}}
.hat{position:absolute;left:50%;bottom:92px;margin-left:-30px;font-size:34px}
.sweet{position:absolute;left:50%;bottom:90px;font-size:32px;pointer-events:none;animation:fly 1.7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),-180px) rotate(540deg);opacity:0}}
.tray{font-size:30px;margin:6px 0;letter-spacing:4px}
.from{margin-top:6px;font-weight:700;color:var(--gold)}
.brand{position:fixed;right:0;bottom:0;z-index:6;padding:7px 14px calc(7px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:800;color:#3b0614;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:16px 0 0 0;box-shadow:0 0 14px #ff9d1c}
.acad{display:inline-block;margin:8px 0;padding:6px 14px;border-radius:20px;border:1px dashed var(--gold);font-weight:700;color:var(--gold);font-size:14px}
.chips{margin:6px 0}.chip{padding:9px 13px;font-size:14px;margin:3px;background:#00000055;color:var(--tx);border:2px solid var(--gold);box-shadow:none}.chip.on{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#3b0614}
.note{font-size:12px;opacity:.7;margin-top:6px}
</style></head><body>
<div class="mandala"></div><canvas id="fw"></canvas>
<div class="toran"><span>🏮</span><span>🌼</span><span>🏮</span><span>🌼</span><span>🏮</span><span>🌼</span><span>🏮</span></div>
<main>
 <div class="card" id="make">
  <div class="diyas"><span>🪔</span><span>🪔</span><span>🪔</span></div>
  <h1>त्योहार की विश बनाइए</h1>
  <div class="sub">जिसे भेजनी है उसका नाम लिखिए 👇</div>
  <input id="nm" placeholder="उसका नाम (जैसे: राहुल भैया)" maxlength="30" autocomplete="off">
  <input id="fr" placeholder="आपका नाम (optional)" maxlength="30" autocomplete="off">
  <div class="sub">कौन सा त्योहार?</div><div class="chips"><button class="chip on" data-t="d" onclick="pick(this)">🪔 दिवाली</button><button class="chip" data-t="t" onclick="pick(this)">🪙 धनतेरस</button><button class="chip" data-t="b" onclick="pick(this)">✨ धनतेरस + दिवाली</button></div>
  <button onclick="go()">✨ शुभकामना बनाओ</button>
 </div>

 <div class="card hide" id="wish">
  <div class="top" id="topT">✦ शुभ दीपावली ✦</div>
  <div class="diyas"><span>🪔</span><span>🪔</span><span>🪔</span><span>🪔</span><span>🪔</span></div>
  <div class="name" id="who"></div>
  <div class="sub" id="blessT"></div>
  <div class="acad">🎓 हमारी Academy परिवार की ओर से</div>
  <div class="stage">
   <div class="monkey" id="mk" onclick="treat()">🐒</div>
   <div class="plate">🍯</div>
  </div>
  <div class="sub">🐒 बंदर मामा लाए हैं मिठाई — उन पर टैप करो!</div>
  <div class="tray" id="tray">🍬🥮🍮🍩🍡🍰</div>
  <div class="from" id="fromT"></div>
  <a class="btn wa" id="waA" href="#" target="_blank" rel="noopener">📲 WhatsApp पर भेजो</a><br>
  <button onclick="nat()">📤 दूसरे ऐप से भेजो</button>
  <button onclick="cp()" id="cb">🔗 मैसेज कॉपी करो</button><br>
  <button onclick="mk2()">✏️ नई विश बनाओ</button>
  <div class="note" id="note"></div>
 </div>
</main>
<div class="brand">✨ Developed by G-MAX Digital Academy</div>

<script>
var BASE=location.href.split('#')[0];
var T='d',TX={d:{top:'✦ शुभ दीपावली ✦',b:'आपके जीवन में खुशियों के दीप जलें,<br>सुख, समृद्धि और सफलता की रोशनी फैले,<br>और घर में माँ लक्ष्मी का वास हो। 🌟',w:'दीपावली',tr:'🍬🥮🍮🍩🍡🍰',pt:['🌼','🏵️','🌸','🪷','✨','🌟']},t:{top:'✦ शुभ धनतेरस ✦',b:'माँ लक्ष्मी और भगवान धन्वंतरि की कृपा से<br>आपका घर धन, स्वास्थ्य और खुशियों से भरा रहे। 🪙',w:'धनतेरस',tr:'🪙🏺💰🪙🏺💰',pt:['🪙','💰','🏺','✨','🌼','🪙']},b:{top:'✦ शुभ धनतेरस व दीपावली ✦',b:'धनतेरस और दीपावली की रोशनी से<br>आपका जीवन धन, स्वास्थ्य और खुशियों से जगमगाए। ✨',w:'धनतेरस और दीपावली',tr:'🪙🏺🍬🥮💰🍰',pt:['🪙','🌼','💰','🌸','✨','🏺']}};
function pick(b){T=b.dataset.t;document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c===b)})}
var $=function(i){return document.getElementById(i)},fx=[],N='',F='';
function parse(){try{var h=decodeURIComponent((location.hash||'').slice(1)).trim();if(!h)return null;var p=h.split('~');return{n:p[0],f:(p[1]||''),t:(TX[p[2]]?p[2]:'d')}}catch(e){return null}}
function show(n,f,t){N=n;F=f;T=t||'d';var X=TX[T];$('topT').textContent=X.top;$('blessT').innerHTML=X.b;$('tray').textContent=X.tr;document.querySelectorAll('.petal').forEach(function(e,i){e.textContent=X.pt[i%X.pt.length]});$('make').classList.add('hide');$('wish').classList.remove('hide');$('who').textContent=n;$('fromT').textContent=f?'— '+f+' की ओर से 💛':'';document.title='शुभ '+X.w+' '+n+' 🪔';$('waA').href='https://wa.me/?text='+encodeURIComponent(msg());boom();setTimeout(boom,800);setTimeout(boom,1700);setTimeout(boom,2800)}
function go(){var n=$('nm').value.trim(),f=$('fr').value.trim();if(!n){$('nm').focus();return}try{location.hash=encodeURIComponent(n+'~'+f+'~'+T)}catch(e){}show(n,f,T)}
function mk2(){$('wish').classList.add('hide');$('make').classList.remove('hide');$('nm').value='';$('fr').value='';try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function link(){return BASE+'#'+encodeURIComponent(N+'~'+F+'~'+T)}
function msg(){return '🪔✨ *'+N+'*, आपको और आपके पूरे परिवार को *'+TX[T].w+' की हार्दिक शुभकामनाएँ!* 🎆🌼\n'+(F?'— '+F+'\n':'')+'🎓 G-MAX Digital Academy की ओर से आपके लिए खास विश 🐒🍬\n👇 खोलकर देखिए, मिठाई आपका इंतज़ार कर रही है!\n'+link()}
function cp(){var t=msg(),d=function(){$('cb').textContent='✅ कॉपी हो गया';$('note').textContent='अब WhatsApp में जाकर paste कर दीजिए'};try{navigator.clipboard.writeText(t).then(d,fb)}catch(e){fb()}function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');d()}catch(e){$('note').textContent='लंबा दबाकर खुद कॉपी करें: '+link()}a.remove()}}
function nat(){if(navigator.share){navigator.share({text:msg()}).catch(function(){})}else cp()}
function treat(){var s=['🍬','🥮','🍮','🍩','🍡','🍰','🍫'],st=document.querySelector('.stage');for(var i=0;i<8;i++){var e=document.createElement('div');e.className='sweet';e.textContent=s[i%s.length];e.style.setProperty('--x',(Math.random()*280-140)+'px');e.style.marginLeft=(Math.random()*30-15)+'px';st.appendChild(e);setTimeout(function(x){x.remove()}.bind(null,e),1800)}boom()}
var pe=['🌼','🏵️','🌸','🪷','✨','🌟'];
for(var i=0;i<22;i++){var p=document.createElement('div');p.className='petal';p.textContent=pe[i%pe.length];p.style.left=Math.random()*100+'vw';p.style.fontSize=(16+Math.random()*18)+'px';p.style.animationDuration=(7+Math.random()*7)+'s';p.style.animationDelay=(-Math.random()*10)+'s';document.body.appendChild(p)}
var c=$('fw'),x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);
function boom(){var cx=Math.random()*c.width*.8+c.width*.1,cy=Math.random()*c.height*.4+60,col=['#ffd54a','#ff7043','#ff4081','#69f0ae','#40c4ff','#fff'][Math.random()*6|0];for(var i=0;i<60;i++){var a=Math.PI*2*i/60,v=2+Math.random()*3.5;fx.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:70,c:col})}}
(function lp(){x.clearRect(0,0,c.width,c.height);fx=fx.filter(function(p){return p.l>0});fx.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.99;p.l--;x.globalAlpha=p.l/70;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2.4,0,7);x.fill()});requestAnimationFrame(lp)})();
addEventListener('hashchange',function(){var r=parse();if(r)show(r.n,r.f,r.t)});
var r0=parse();if(r0)show(r0.n,r0.f,r0.t);
</script></body></html>
